<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RASAP | Monitoring System (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--navy:#2C334F;--teal:#2C334F;--aqua:#8CC1CC;--gold:#E1DABD;--cream:#F1F0DC;--dark:#1F2438}
*{box-sizing:border-box;font-family:'Inter',sans-serif}body{margin:0;background:var(--cream);color:#1e293b;font-size:14px}
button,input,select,textarea{font-family:'Inter',sans-serif;font-size:14px}
#app{display:flex;min-height:100vh}aside{width:250px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #ffffff22}.brand img{height:42px}
.logo-fb{width:42px;height:42px;border:2px solid var(--gold);border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--gold);font-weight:700}
.brand b{letter-spacing:.15em;font-size:18px}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:#aab8c5;padding:11px 18px;cursor:pointer}
nav button:hover{color:#fff;background:#ffffff0d}nav button.on{color:var(--gold);border-left-color:var(--gold);background:#8CC1CC40}
main{flex:1;min-width:0;display:flex;flex-direction:column}header{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dde;gap:10px}
.content{padding:20px;max-width:1300px;width:100%}h2{margin:0 0 4px;color:var(--navy)}h3{margin:0 0 10px;color:var(--teal)}
.demo{background:#F1F0DC;border:1px solid #cfc79f;border-radius:6px;padding:8px 12px;font-size:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:16px;margin-bottom:12px}.stat b{display:block;font-size:26px;color:var(--teal)}.stat span{color:#64748b;font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid #e5e9ef;text-align:left;white-space:nowrap}th{background:var(--navy);color:#fff;font-weight:600;font-size:12px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;margin:2px}.btn:hover{background:var(--dark)}.btn.g{background:var(--gold);color:var(--navy);font-weight:600}.btn.r{background:#b42318}.btn.s{background:#e2e8f0;color:#1e293b}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}label{font-size:12px;font-weight:600;color:#475569;display:block;margin:8px 0 3px}
.bd{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#e2e8f0}.Approved{background:#d1fae5;color:#065f46}.Pending{background:#fef3c7;color:#92400e}.Rejected{background:#fee2e2;color:#991b1b}.Returned{background:#e0e7ff;color:#3730a3}
.bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--aqua)}
.login{max-width:420px;margin:6vh auto;padding:0 14px}.err{color:#b42318;font-size:12px;margin-top:4px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}.modal>div{background:#fff;border-radius:8px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#burger{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
@media(max-width:800px){aside{position:fixed;left:-260px;top:0;bottom:0;z-index:8;transition:.2s}aside.open{left:0}#burger{display:inline-block}}
@media print{aside,header,.np{display:none!important}.content{padding:0}}
</style></head><body><div id="app"></div>
<script>
/* ===== RBAC (FRONTEND DEMO ONLY - NOT SECURE; real enforcement needs a trusted server) ===== */
const ALL=['view','edit','upload','download','approve','reject','enable_edit','mentoring','reports','audit','users'];
const rolePermissions={
 student:['view','edit','upload','download','reports'],
 faculty_view:['view','download'],
 faculty_coordinator:['view','download','approve','reject','enable_edit','mentoring','reports'],
 rasap_coordinator:['view','download','approve','reject','enable_edit','reports','audit','users'],
 rasap_faculty:['view','download','mentoring','reports'],
 parent:['view','download','reports']};
const ROLES={student:'Student',faculty_view:'Faculty View',faculty_coordinator:'Faculty Coordinator',rasap_coordinator:'RASAP Coordinator',rasap_faculty:'RASAP Faculty',parent:'Parent'};
const NAV={
 student:[['dash','Overview'],['profile','My Profile'],['academic','My Academic Record'],['acts','Training & Activities'],['edoc','E-Doccut'],['mentor','Mentoring Feedback'],['notes','Notifications'],['reports','Reports & Downloads'],['links','Quick Links']],
 faculty_view:[['dash','Overview'],['students','Students'],['academic','Academic Records'],['edoc','Approved Documents'],['links','Quick Links']],
 faculty_coordinator:[['dash','Overview'],['students','Assigned Students'],['queue','Verification Queue'],['academic','Academic Verification'],['acts','Training Verification'],['edoc','Documents'],['mentor','Mentoring Records'],['progress','Progress Monitoring'],['editaccess','Edit Access'],['reports','Reports'],['notes','Notifications'],['links','Quick Links']],
 rasap_coordinator:[['dash','Overview'],['students','All Students'],['queue','Verification Queue'],['progress','Progress Monitoring'],['editaccess','Edit Access'],['reports','Reports'],['audit','Audit Log'],['links','Quick Links']],
 rasap_faculty:[['dash','Overview'],['students','Students'],['academic','Academic Records'],['progress','Progress'],['mentor','Mentoring'],['reports','Reports'],['links','Quick Links']],
 parent:[['dash','Ward Overview'],['academic','Academic Performance'],['acts','Approved Activities'],['edoc','Approved Certificates'],['mentor','Mentoring Summaries'],['reports','Reports'],['links','Quick Links']]};
const VIEWPERM={audit:'audit',queue:'approve',editaccess:'enable_edit',mentor:'view'};
let U=null,view='dash';const $=s=>document.querySelector(s);
const getCurrentUser=()=>U,getCurrentRole=()=>U&&U.role;
const hasPermission=p=>!!U&&rolePermissions[U.role].includes(p);
function requirePermission(p,ref){if(hasPermission(p))return true;log('Access Denied',ref||'-','Denied','Needs '+p);toast('Access Denied: missing permission "'+p+'"');return false}
const canEditRecord=r=>hasPermission('edit')&&(!r.status||['Draft','Rejected','Returned','Edit Enabled'].includes(r.status));
const canApproveDocument=()=>hasPermission('approve');
const canDownloadDocument=d=>hasPermission('download')&&(U.role==='student'||d.status==='Approved'||hasPermission('approve'));

/* ===== DATA (localStorage; local to this browser only) ===== */
const KEY='rasap_demo_v1';let S;
const depts=['Social Work','Psychology','Sociology','Media Studies','Business Studies'];
function seed(){const st=[];const n=['A. Demo','B. Sample','C. Test','D. Example','E. Placeholder','F. Mock','G. Trial','H. Dummy','I. Specimen','J. Model'];
 n.forEach((x,i)=>st.push({id:'DEMO'+(101+i),name:x+' (Demo Student)',dept:depts[i%5],prog:i%2?'BA':'BSW',year:1+i%3,sem:1+(i%3)*2,coord:i<6?'FC1':'FC2'}));
 const sub=[['Research Methods','RM101'],['Communication','CM102'],['Human Behaviour','HB103']];
 const ac=[];st.forEach((s,i)=>sub.forEach((b,j)=>ac.push({id:'AC'+i+j,sid:s.id,year:1+j,sem:1+j*2,sub:b[0],code:b[1],im:15+(i+j)%6,imax:25,em:40+(i*3+j*5)%30,att:60+(i*7+j*9)%40,status:j===0?'Verified':'Draft'})));
 const stat=['Approved','Pending Review','Rejected','Approved','Pending Review'];const dc=[];
 st.forEach((s,i)=>{for(let k=0;k<2+i%2;k++)dc.push({id:'DOC'+i+k,sid:s.id,title:['Language Certificate','Workshop Certificate','Internship Letter'][k],cat:['Language Test Certificates','Workshop Certificates','Internship Certificates'][k],year:s.year,sem:s.sem,act:'Demo activity',desc:'Demo description (sample data).',date:'2026-0'+(1+k)+'-1'+i,status:stat[(i+k)%5],remarks:stat[(i+k)%5]==='Rejected'?'Scan unclear (demo remark)':'',file:null,hist:[]})});
 const ax=[];st.forEach((s,i)=>{ax.push({id:'AT'+i,sid:s.id,title:'Community Outreach',cat:'Extra-curricular',domain:'Volunteering',org:'Demo NGO',date:'2026-02-10',dur:'20h',role:'Volunteer',desc:'Demo entry',status:i%2?'Approved':'Pending Review'})});
 return{students:st,acad:ac,docs:dc,acts:ax,ment:st.slice(0,4).map((s,i)=>({id:'M'+i,sid:s.id,date:'2026-03-0'+(i+1),obs:'Engaged in sessions (demo).',prog:'Satisfactory',part:'Good',actions:'Complete portfolio',follow:'Open',next:'2026-04-05',share:i%2===0,private:'Private mentor note (demo).'})),
 notes:[{id:1,to:'all',t:'Welcome to the RASAP demo. All data is DEMO DATA.',d:'2026-09-01',read:false},{id:2,to:'student',t:'Upcoming deadline: submit certificates (demo).',d:'2026-09-20',read:false}],audit:[]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.students)S=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full: could not save (file too large?)')}}
function log(action,rec,status,remarks){S.audit.unshift({ts:new Date().toLocaleString(),uid:U?U.email:'-',role:U?ROLES[U.role]:'-',action,rec:rec||'-',status:status||'OK',rem:remarks||''});S.audit=S.audit.slice(0,300);save()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:16px;right:16px;background:#2C334F;color:#fff;padding:10px 16px;border-radius:6px;z-index:99;border-left:4px solid #E1DABD';document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
const short=s=>s==='Pending Review'?'Pending':s==='Returned for Correction'?'Returned':s;
const badge=s=>`<span class="bd ${short(s).split(' ')[0]}">${esc(s)}</span>`;

/* ===== SCOPE: which students this demo user may see ===== */
function myStudents(){if(U.role==='student'||U.role==='parent')return S.students.filter(s=>s.id===U.sid);
 if(U.role==='faculty_coordinator')return S.students.filter(s=>s.coord==='FC1');return S.students}
const ids=()=>myStudents().map(s=>s.id);const sname=id=>(S.students.find(s=>s.id===id)||{}).name||id;
const scopedDocs=()=>S.docs.filter(d=>ids().includes(d.sid)&&(U.role!=='parent'&&U.role!=='faculty_view'||d.status==='Approved'));

/* ===== LOGIN ===== */
function loginView(){$('#app').innerHTML=`<div class="login"><div class="card" style="border-top:4px solid var(--aqua)">
<div style="text-align:center"><img src="logo.png" alt="Rajagiri" style="height:70px" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="logo-fb" style="margin:auto;width:64px;height:64px">RCSS</div>
<h2 style="letter-spacing:.15em;margin-top:8px">RASAP</h2><small style="color:var(--teal)">Monitoring System · Rajagiri College of Social Sciences</small></div>
<div class="demo"><b>DEMONSTRATION LOGIN.</b> This prototype cannot verify who you are or that you own a Rajagiri email. The role below is a <i>simulation</i>, not secure authentication.</div>
<label>Rajagiri email</label><input id="em" type="text" placeholder="student@rajagiri.edu" autocomplete="off"><div class="err" id="e1"></div>
<label>Password</label><div style="display:flex;gap:6px"><input id="pw" type="password" autocomplete="off"><button class="btn s" onclick="pw.type=pw.type=='password'?'text':'password'">Show</button></div><div class="err" id="e2"></div>
<label>Demo role (simulation only)</label><select id="rl">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
<button class="btn g" style="width:100%;margin-top:14px;padding:10px" onclick="doLogin()">Login (Demo)</button>
<p style="text-align:center"><a href="#" onclick="toast('Demo only: password reset needs an institutional auth service.');return false">Forgot password?</a></p>
<p style="font-size:11px;color:#64748b">/* INTEGRATION POINT: replace doLogin() with Google OAuth / institutional SSO; roles must be assigned by a trusted backend. */</p></div></div>`}
function doLogin(){const em=$('#em').value.trim().toLowerCase(),p=$('#pw').value,r=$('#rl').value;let ok=true;$('#e1').textContent=$('#e2').textContent='';
 if(!/^[a-z0-9._%+-]+@rajagiri\.edu$/.test(em)){$('#e1').textContent='Enter a valid email ending with @rajagiri.edu';ok=false}
 if(p.length<6){$('#e2').textContent='Password must be at least 6 characters (demo: not checked or stored)';ok=false}
 if(!ok)return;U={email:em,role:r,sid:'DEMO101'};view='dash';log('Login','-','OK','Demo login as '+ROLES[r]);render()}
function logout(){log('Logout');U=null;loginView()}

/* ===== SHELL ===== */
function render(){const nav=NAV[U.role].filter(([k])=>!VIEWPERM[k]||hasPermission(VIEWPERM[k])||k==='mentor');
 $('#app').innerHTML=`<aside id="sb"><div class="brand"><img src="logo.png" alt="Rajagiri" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="logo-fb">R</div><div><b>RASAP</b><small>Monitoring System</small></div></div><nav>${nav.map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav></aside>
<main><header><div><button class="btn np" id="burger" onclick="sb.classList.toggle('open')">☰</button> <b>${ROLES[U.role]}</b> · <small>${esc(U.email)}</small></div><button class="btn s" onclick="logout()">Logout</button></header><div class="content" id="ct"></div></main>`;
 const f={dash,profile,academic,acts,edoc,mentor,notes,reports,links,students,queue,progress,editaccess,audit}[view];
 const allowed=NAV[U.role].some(([k])=>k===view)&&(!VIEWPERM[view]||hasPermission(VIEWPERM[view]));
 if(!allowed){log('Access Denied',view,'Denied');$('#ct').innerHTML='<div class="card"><h2>Access Denied</h2><p>Your role does not permit this section. (Browser-side check only — not real security.)</p></div>';return}
 f();charts()}
function go(v){view=v;const a=NAV[U.role].some(([k])=>k===v);if(!a){log('Access Denied',v,'Denied');}sb&&sb.classList.remove('open');render()}
const foot='<div class="demo">Data is <b>DEMO DATA</b> stored in this browser only (localStorage). Not shared across users/devices; not tamper-proof; JS permissions are not secure access control.</div>';
let CH=[];function charts(){CH.forEach(c=>c());CH=[]}
function mk(id,type,labels,data,colors){const el=document.getElementById(id);if(!el||!window.Chart)return;const c=new Chart(el,{type,data:{labels,datasets:[{data,backgroundColor:colors||['#2C334F','#8CC1CC','#E1DABD','#1F2438','#b42318']}]},options:{responsive:true,plugins:{legend:{display:type!=='bar'}}}});CH.push(()=>c.destroy())}
const cnt=(a,f)=>a.filter(f).length;
function stats(docs){return{ap:cnt(docs,d=>d.status==='Approved'),pe:cnt(docs,d=>d.status==='Pending Review'),rj:cnt(docs,d=>d.status==='Rejected')}}
function attention(){return myStudents().filter(s=>S.docs.some(d=>d.sid===s.id&&['Rejected','Returned for Correction'].includes(d.status))||S.acad.some(a=>a.sid===s.id&&(a.att<75||a.im<10)))}

/* ===== DASHBOARD ===== */
let F={dept:'',prog:'',year:'',status:''};
function dash(){const sts=myStudents().filter(s=>(!F.dept||s.dept===F.dept)&&(!F.prog||s.prog===F.prog)&&(!F.year||s.year==F.year));const idl=sts.map(s=>s.id);
 const docs=S.docs.filter(d=>idl.includes(d.sid)&&(!F.status||d.status===F.status));const st=stats(docs);const tot=docs.length||1;
 const me=S.students.find(s=>s.id===U.sid);
 let h=`<h2>${ROLES[U.role]} Dashboard</h2>${foot}`;
 if(U.role==='student'||U.role==='parent')h+=`<div class="card"><b>${esc(me.name)}</b> · ID ${me.id} · ${me.dept} · ${me.prog} · Year ${me.year} · Sem ${me.sem}<br><small>Profile completion</small><div class="bar"><i style="width:${U.role==='student'?70:100}%"></i></div></div>`;
 else h+=`<div class="card row np"><div><label>Department</label><select onchange="F.dept=this.value;render()"><option value="">All</option>${depts.map(d=>`<option ${F.dept==d?'selected':''}>${d}</option>`)}</select></div><div><label>Programme</label><select onchange="F.prog=this.value;render()"><option value="">All</option><option ${F.prog=='BA'?'selected':''}>BA</option><option ${F.prog=='BSW'?'selected':''}>BSW</option></select></div><div><label>Academic Year</label><select onchange="F.year=this.value;render()"><option value="">All</option>${[1,2,3].map(y=>`<option ${F.year==y?'selected':''}>${y}</option>`)}</select></div><div><label>Verification Status</label><select onchange="F.status=this.value;render()"><option value="">All</option><option>Approved</option><option>Pending Review</option><option>Rejected</option></select></div></div>`;
 h+=`<div class="grid">${[['Students',sts.length],['Approved Docs',st.ap],['Pending Docs',st.pe],['Rejected Docs',st.rj],['Need Attention',cnt(attention(),s=>idl.includes(s.id))]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`;
 h+=`<div class="grid g2"><div class="card"><h3>Document Verification</h3><canvas id="c1" height="160"></canvas><p>Approved ${st.ap} (${Math.round(st.ap/tot*100)}%) · Pending ${st.pe} (${Math.round(st.pe/tot*100)}%) · Rejected ${st.rj} (${Math.round(st.rj/tot*100)}%)</p></div>`;
 if(!['student','parent'].includes(U.role)){const dc=depts.map(d=>cnt(sts,s=>s.dept===d));h+=`<div class="card"><h3>Department-wise Distribution (DEMO DATA)</h3><canvas id="c2" height="160"></canvas><div class="tw"><table><tr><th>Department</th><th>Students</th></tr>${depts.map((d,i)=>`<tr><td>${d}</td><td>${dc[i]}</td></tr>`).join('')}<tr><td><b>Total Enrolled</b></td><td><b>${sts.length}</b></td></tr></table></div></div>`}
 h+=`</div>`;$('#ct').innerHTML=h;
 setTimeout(()=>{mk('c1','doughnut',['Approved','Pending Review','Rejected'],[st.ap,st.pe,st.rj],['#2e7d32','#c9a227','#b42318']);if(document.getElementById('c2'))mk('c2','bar',depts,depts.map(d=>cnt(sts,s=>s.dept===d)),['#2C334F'])},0)}
function profile(){const m=S.students.find(s=>s.id===U.sid);$('#ct').innerHTML=`<h2>My Profile</h2>${foot}<div class="card">${Object.entries({Name:m.name,'Student ID':m.id,Department:m.dept,Programme:m.prog,'Academic Year':m.year,Semester:m.sem,Email:U.email}).map(([k,v])=>`<p><b>${k}:</b> ${esc(v)}</p>`).join('')}</div>`}

/* ===== ACADEMIC ===== */
let AF={y:'',s:''};
function academic(){const rows=S.acad.filter(a=>ids().includes(a.sid)&&(!AF.y||a.year==AF.y)&&(!AF.s||a.sem==AF.s));const stu=U.role==='student';
 $('#ct').innerHTML=`<h2>${U.role==='student'?'My Academic Record':'Academic Records'}</h2>${foot}<div class="card row np"><div><label>Year</label><select onchange="AF.y=this.value;render()"><option value="">All</option>${[1,2,3].map(y=>`<option ${AF.y==y?'selected':''}>${y}</option>`)}</select></div><div><label>Semester</label><select onchange="AF.s=this.value;render()"><option value="">All</option>${[1,2,3,4,5,6].map(y=>`<option ${AF.s==y?'selected':''}>${y}</option>`)}</select></div>${stu?'<div><button class="btn g" onclick="acForm()">+ Add Record</button></div>':''}</div>
<div class="tw"><table><tr><th>Student</th><th>Year</th><th>Sem</th><th>Subject</th><th>Code</th><th>Internal</th><th>Max</th><th>External</th><th>Total</th><th>Grade</th><th>Attendance</th><th>Status</th><th>Actions</th></tr>${rows.map(a=>{const t=a.im+a.em;const g=t>=80?'A':t>=65?'B':t>=50?'C':t>=40?'D':'F';const ed=stu&&(a.status!=='Verified'||a.edit);
 return`<tr><td>${esc(sname(a.sid))}</td><td>${a.year}</td><td>${a.sem}</td><td>${esc(a.sub)}</td><td>${esc(a.code)}</td><td>${a.im}</td><td>${a.imax}</td><td>${a.em}</td><td>${t}</td><td>${g}</td><td>${a.att}%</td><td>${a.edit?'Edit Enabled':a.status} · ${t>=40&&a.att>=75?'Good standing':'Attention'}</td><td>${ed?`<button class="btn" onclick="acForm('${a.id}')">Edit</button>`:''}${hasPermission('approve')&&a.status!=='Verified'?`<button class="btn g" onclick="verAc('${a.id}')">Verify</button>`:''}${hasPermission('enable_edit')&&a.status==='Verified'&&!a.edit?`<button class="btn s" onclick="enAc('${a.id}')">Enable Edit</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=13>No records</td></tr>'}</table></div>`}
function acForm(id){if(!requirePermission('edit',id))return;const a=S.acad.find(x=>x.id===id)||{year:1,sem:1,sub:'',code:'',im:0,imax:25,em:0,att:0};
 modal(`<h3>${id?'Edit':'Add'} Academic Record</h3><div class="row"><div><label>Year (1-3)</label><input id="f_y" type="number" value="${a.year}"></div><div><label>Semester (1-6)</label><input id="f_s" type="number" value="${a.sem}"></div></div><label>Subject</label><input id="f_sub" value="${esc(a.sub)}"><label>Code</label><input id="f_c" value="${esc(a.code)}"><div class="row"><div><label>Internal</label><input id="f_im" type="number" value="${a.im}"></div><div><label>Max internal</label><input id="f_mx" type="number" value="${a.imax}"></div><div><label>External</label><input id="f_em" type="number" value="${a.em}"></div><div><label>Attendance %</label><input id="f_at" type="number" value="${a.att}"></div></div><div class="err" id="fe"></div><button class="btn g" onclick="saveAc('${id||''}')">Save</button><button class="btn s" onclick="closeM()">Cancel</button>`)}
function saveAc(id){const v=k=>$('#f_'+k).value.trim(),n=k=>+v(k);let e='';

const DCATS=['Academic Certificates','Marksheets','Transcripts','Training Certificates','Internship Certificates','Workshop Certificates','Sports Certificates','Arts Certificates','Volunteering Certificates','Research Documents','Project Documents','Language Test Certificates','Other Supporting Documents'];
function edoc(){const rows=scopedDocs();const stu=U.role==='student';
 $('#ct').innerHTML=`<h2>E-Doccut</h2>${foot}${stu?'<button class="btn g np" onclick="docForm()">+ Upload Document</button>':''}<div class="tw"><table><tr><th>Student</th><th>Title</th><th>Category</th><th>Year/Sem</th><th>Activity</th><th>Uploaded</th><th>File</th><th>Status</th><th>Remarks</th><th>Actions</th></tr>${rows.map(d=>{const cd=canDownloadDocument(d);return`<tr><td>${esc(sname(d.sid))}</td><td>${esc(d.title)}</td><td>${d.cat}</td><td>${d.year}/${d.sem}</td><td>${esc(d.act)}</td><td>${d.date}</td><td>${d.file?esc(d.file.name):'<i>demo (no file)</i>'}</td><td>${badge(d.status)}</td><td>${esc(d.remarks)}</td><td>${cd?`<button class="btn" onclick="viewDoc('${d.id}')">View</button><button class="btn s" onclick="dlDoc('${d.id}')">Download</button>`:''}${stu&&canEditRecord(d)?`<button class="btn s" onclick="docForm('${d.id}')">Edit/Replace</button><button class="btn g" onclick="submitDoc('${d.id}')">Submit</button>`:''}${hasPermission('approve')&&d.status==='Pending Review'?`<button class="btn g" onclick="review('${d.id}')">Review</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=10>No documents</td></tr>'}</table></div>`}
function docForm(id){if(!requirePermission('upload',id))return;const d=S.docs.find(x=>x.id===id)||{title:'',cat:DCATS[0],year:1,sem:1,act:'',desc:''};
 modal(`<h3>${id?'Edit / Replace':'Upload'} Document</h3><label>Title</label><input id="d_t" value="${esc(d.title)}"><label>Category</label><select id="d_c">${DCATS.map(c=>`<option ${c==d.cat?'selected':''}>${c}</option>`)}</select><div class="row"><div><label>Academic year</label><select id="d_y">${[1,2,3].map(y=>`<option ${y==d.year?'selected':''}>${y}</option>`)}</select></div><div><label>Semester</label><select id="d_s">${[1,2,3,4,5,6].map(y=>`<option ${y==d.sem?'selected':''}>${y}</option>`)}</select></div></div><label>Activity / training name</label><input id="d_a" value="${esc(d.act)}"><label>Description</label><textarea id="d_d" rows="6">${esc(d.desc)}</textarea><label>File (PDF, JPG, JPEG, PNG · max 1 MB in this demo)</label><input id="d_f" type="file" accept=".pdf,.jpg,.jpeg,.png"><div class="err" id="fe"></div><button class="btn g" onclick="saveDoc('${id||''}')">Save</button><button class="btn s" onclick="closeM()">Cancel</button>`)}
function saveDoc(id){const g=k=>$('#d_'+k).value.trim(),f=$('#d_f').files[0];let e='';if(!g('t'))e='Title required. ';if(!id&&!f)e+='Please choose a file. ';
 if(f){if(!/\.(pdf|jpe?g|png)$/i.test(f.name)||!['application/pdf','image/jpeg','image/png'].includes(f.type))e+='Only PDF/JPG/JPEG/PNG allowed. ';if(f.size>1048576)e+='File exceeds 1 MB demo limit. '}
 if(e){$('#fe').textContent=e;return}
 const fin=file=>{let d=S.docs.find(x=>x.id===id);const isNew=!d;if(isNew)d={id:uid('DOC'),sid:U.sid,hist:[]};else d.hist.push({ts:new Date().toLocaleString(),title:d.title,desc:d.desc,status:d.status});
  Object.assign(d,{title:g('t'),cat:g('c'),year:+g('y'),sem:+g('s'),act:g('a'),desc:g('d'),date:new Date().toISOString().slice(0,10),status:isNew?'Draft':d.status});if(file)d.file=file;if(isNew)S.docs.push(d);log(isNew?'Document Upload':'Record Editing',d.id);save();closeM();toast('Saved. Use Submit to send for verification.');render()};
 if(f){const r=new FileReader();r.onload=()=>fin({name:f.name,type:f.type,data:r.result});r.readAsDataURL(f)}else fin(null)}
function submitDoc(id){const d=S.docs.find(x=>x.id===id);if(!d.file){toast('Attach a file before submitting');return}d.status='Pending Review';d.remarks='';log('Document Resubmission',id);note('faculty_coordinator','Pending verification: '+d.title);save();render()}
function docBlob(d){const [h,b]=d.file.data.split(',');const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:d.file.type})}
function viewDoc(id){const d=S.docs.find(x=>x.id===id);if(!d.file)return toast('Demo record: no uploaded file exists.');window.open(URL.createObjectURL(docBlob(d)),'_blank')}
function dlDoc(id){const d=S.docs.find(x=>x.id===id);if(!d.file)return toast('Demo record: no uploaded file exists.');dl(docBlob(d),d.file.name)}

function review(id){if(!requirePermission('approve',id))return;const d=S.docs.find(x=>x.id===id);
 modal(`<h3>Review: ${esc(d.title)}</h3><p>${esc(sname(d.sid))} · ${d.cat}</p><p>${esc(d.desc)}</p>${d.file?`<button class="btn" onclick="viewDoc('${id}')">Open evidence</button>`:'<p><i>Demo record without file</i></p>'}<label>Remarks</label><textarea id="rm" rows="3"></textarea><button class="btn g" onclick="decide('${id}','Approved')">Approve</button><button class="btn r" onclick="decide('${id}','Rejected')">Reject</button><button class="btn" onclick="decide('${id}','Returned for Correction')">Return for Correction</button>`)}

 d.status=s;d.remarks=r;d.edit=false;log(s==='Approved'?'Document Approval':'Document Rejection',id,'OK',r);note('student','Document "'+d.title+'": '+s+(r?' – '+r:''));save();closeM();render()}

function rbtn(){$('#rb').innerHTML=`<button class="btn" onclick="dl(new Blob([RP.html],{type:'text/html'}),'report.html')">Download Report</button><button class="btn" onclick="dl(new Blob([RP.csv],{type:'text/csv'}),'report.csv')">Export CSV</button><button class="btn s" onclick="window.print()">Print</button><button class="btn s" onclick="dlSupport()">Download Supporting Documents</button>`}
function genReport(){if(!requirePermission('reports'))return;const type=$('#rt').value,sid=$('#rs')?$('#rs').value:ids()[0];RP.sid=sid;const s=S.students.find(x=>x.id===sid);
 const onlyOk=type==='exit'||U.role==='parent';const dd=S.docs.filter(d=>d.sid===sid&&(onlyOk||d.status==='Approved'||U.role==='student'));const ac=S.acad.filter(a=>a.sid===sid&&(!onlyOk||a.status==='Verified'));const ax=S.acts.filter(a=>a.sid===sid&&(!onlyOk||a.status==='Approved'));const ms=S.ment.filter(m=>m.sid===sid&&m.share);
 let h='',c='';const T=(hd,rows)=>`<table border=1 cellpadding=5 style="border-collapse:collapse;width:100%"><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`;
 if(type==='cohort'){const sts=myStudents();h=`<h2>Cohort Report (DEMO DATA)</h2><p>Total students: ${sts.length}</p>`+T(['Department','Students'],depts.map(d=>[d,cnt(sts,x=>x.dept===d)]))+`<h3>Document verification</h3>`+T(['Approved','Pending','Rejected'],[[cnt(S.docs,d=>d.status==='Approved'),cnt(S.docs,d=>d.status==='Pending Review'),cnt(S.docs,d=>d.status==='Rejected')]])+`<h3>Training participation</h3><p>${S.acts.length} activity records</p>`;c='Department,Students\n'+depts.map(d=>d+','+cnt(sts,x=>x.dept===d)).join('\n')}
 else{h=`<h2>${type==='exit'?'Third-Year Exit Interview Profile (verified records only)':'Individual Student Report'}</h2><p>${esc(s.name)} · ${s.id} · ${s.dept} · ${s.prog} · Year ${s.year}</p><h3>Academic Records</h3>`+T(['Year','Sem','Subject','Internal','External','Attendance','Status'],ac.map(a=>[a.year,a.sem,a.sub,a.im+'/'+a.imax,a.em,a.att+'%',a.status]))+`<h3>Activities & Training</h3>`+T(['Title','Category','Domain','Date','Status'],ax.map(a=>[a.title,a.cat,a.domain,a.date,a.status]))+`<h3>Documents</h3>`+T(['Title','Category','Status','File attached'],dd.map(d=>[d.title,d.cat,d.status,d.file?'Yes':'No (demo record)']))+`<h3>Shareable Mentoring Summaries</h3>`+T(['Date','Progress','Action points'],ms.map(m=>[m.date,m.prog,m.actions]))+`<p><small>DEMO report generated ${new Date().toLocaleString()}</small></p>`;
  c='Type,Title,Detail,Status\n'+ac.map(a=>`Academic,"${a.sub}",Y${a.year} S${a.sem} ${a.im+a.em},${a.status}`).concat(ax.map(a=>`Activity,"${a.title}",${a.cat},${a.status}`),dd.map(d=>`Document,"${d.title}",${d.cat},${d.status}`)).join('\n')}
 RP.html=h;RP.csv=c;RP.sid=sid;log('Report Generation',sid,'OK',type);$('#rp').innerHTML=h;rbtn()}
function dlSupport(){const dd=S.docs.filter(d=>d.sid===RP.sid&&d.status==='Approved'&&d.file);if(!dd.length)return toast('No approved documents with uploaded files (demo records have no file).');dd.forEach(dlDoc2)}
const dlDoc2=d=>dl(docBlob(d),d.file.name);

/* ===== MODAL / INIT ===== */
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='md';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m)}
function closeM(){const m=$('#md');m&&m.remove()}
load();loginView();
</script></body></html>
